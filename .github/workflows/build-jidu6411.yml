name: Build OpenWrt JIDU6411 (6.18 + EDMA/IRQ Fixes)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3-setuptools python3-pyelftools rsync swig \
            unzip zlib1g-dev file wget libelf-dev ccache

      - name: Restore OpenWrt download & ccache caches
        uses: actions/cache/restore@v4
        with:
          path: |
            cache/dl
            cache/ccache
          key: jidu6411-cache-${{ github.run_id }}
          restore-keys: jidu6411-cache-

      - name: Clone OpenWrt main and apply reviewed PRs
        run: |
          set -euo pipefail
          git config --global user.name "ci"
          git config --global user.email "ci@localhost"

          git clone --depth 1 --branch main https://github.com/openwrt/openwrt.git openwrt
          cd openwrt

          # 1. Apply JioRouter AX6000 (JIDU6411) device support (PR #26498)
          curl -fsSL "https://github.com/openwrt/openwrt/pull/26498.patch" | git apply --check
          curl -fsSL "https://github.com/openwrt/openwrt/pull/26498.patch" | git apply

          # 2. Add JIDU6J11 IPQ9574 BDF and ath11k 512MB RAM OOM fixes (PR #24254)
          mkdir -p package/firmware/ipq-wifi/src package/kernel/mac80211/patches/ath11k
          curl -fsSL "https://raw.githubusercontent.com/SahilB69/jidu6j11-openwrt/main/bdf/board-jiorouter_ax6000-jidu6j11.ipq9574" \
            -o package/firmware/ipq-wifi/src/board-jiorouter_ax6000-jidu6j11.ipq9574
          curl -fsSL "https://raw.githubusercontent.com/SahilB69/jidu6j11-openwrt/main/patches/ath11k/954-wifi-ath11k-make-external-IRQ-control-idempotent.patch" \
            -o package/kernel/mac80211/patches/ath11k/954-wifi-ath11k-make-external-IRQ-control-idempotent.patch
          curl -fsSL "https://raw.githubusercontent.com/SahilB69/jidu6j11-openwrt/main/patches/ath11k/955-wifi-ath11k-use-private-page-frag-caches-for-rxdma.patch" \
            -o package/kernel/mac80211/patches/ath11k/955-wifi-ath11k-use-private-page-frag-caches-for-rxdma.patch

          # 3. Apply PR #26461 (EDMA wake Tx queue of completed ring)
          curl -fsSL "https://github.com/openwrt/openwrt/pull/26461.patch" | git apply --check
          curl -fsSL "https://github.com/openwrt/openwrt/pull/26461.patch" | git apply

          # 4. Apply PR #26741 (EDMA spread Rx ring interrupts over cores)
          curl -fsSL "https://github.com/openwrt/openwrt/pull/26741.patch" | git apply --check
          curl -fsSL "https://github.com/openwrt/openwrt/pull/26741.patch" | git apply

          # 5. Apply ath11k PCI DP MSI IRQ spread from PR #26253 (skipping ath10k-ct/ath10k)
          curl -fsSL "https://github.com/openwrt/openwrt/pull/26253.patch" \
            | git apply --include='package/kernel/mac80211/patches/ath11k/*' --check
          curl -fsSL "https://github.com/openwrt/openwrt/pull/26253.patch" \
            | git apply --include='package/kernel/mac80211/patches/ath11k/*'

          # Persist download/ccache dirs
          mkdir -p ../cache/dl ../cache/ccache
          ln -sfn "$PWD/../cache/dl" dl
          ln -sfn "$PWD/../cache/ccache" .ccache
          echo "max_size = 3.0G" > ../cache/ccache/ccache.conf

          # Update & install feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Generate .config for JIDU6411 AP/mesh image
          cat << 'EOF' > .config
          CONFIG_TARGET_qualcommbe=y
          CONFIG_TARGET_qualcommbe_ipq95xx=y
          CONFIG_TARGET_qualcommbe_ipq95xx_DEVICE_jiorouter_ax6000-jidu6411=y
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          CONFIG_PACKAGE_luci=y
          # CONFIG_PACKAGE_wpad-basic-mbedtls is not set
          CONFIG_PACKAGE_wpad-mesh-mbedtls=y
          CONFIG_PACKAGE_usteer=y
          CONFIG_PACKAGE_luci-app-usteer=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_ip-full=y
          EOF
          make defconfig

      - name: Download sources
        working-directory: openwrt
        run: make download -j$(nproc)

      - name: Compile OpenWrt image
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Save caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache/dl
            cache/ccache
          key: jidu6411-cache-${{ github.run_id }}

      - name: Collect firmware artifacts
        run: |
          mkdir -p out
          cp -v openwrt/bin/targets/qualcommbe/ipq95xx/*jidu6411* out/
          cp -v openwrt/bin/targets/qualcommbe/ipq95xx/sha256sums out/SHA256SUMS
          ls -lh out/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: jidu6411-openwrt-firmware
          path: out/
          retention-days: 30
